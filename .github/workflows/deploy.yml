name: Deploy to Cloudflare Workers (OpenNext)

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (runs prisma generate via postinstall)
        run: npm ci

      - name: Build with OpenNext for Cloudflare
        env:
          NEXT_PUBLIC_SITE_URL: https://public-holidays.shop
        run: npx @opennextjs/cloudflare@latest build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
